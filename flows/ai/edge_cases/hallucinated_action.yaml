# Worked example for the fictional Example Notes app — replace ids with your app's (inspect_screen).
# Every id below is illustrative; nothing here has been run against a real build.
# Selectors come from the flavor env (config/README.md → flavors.json).
appId: ${APP_ID}
env:                                   # defaults = Example Notes ids; the flavor env (config/flavors.json) wins
  ASSISTANT_OPEN: assistant_open_button
  PROMPT_INPUT: assistant_input
  SUBMIT_BUTTON: assistant_send_button
  ASSISTANT_RESPONSE: assistant_response
  ASSISTANT_ACTION_CONFIRMATION: assistant_action_confirmation
  LLM_TEST_TIMEOUT_MS: "15000"
name: "AI Edge Case: Hallucinated Action Detection"
tags:
  - ai
  - edge-case
  - meta-testing
---
- runFlow: ../../baseline/auth/login_happy_path.yaml
- tapOn:
    id: "${ASSISTANT_OPEN}"
- runFlow:
    file: ../_subflows/send_chat_message.yaml
    env:
      PROMPT_INPUT: ${PROMPT_INPUT}
      SUBMIT_BUTTON: ${SUBMIT_BUTTON}
      MESSAGE: "Open the quantum dashboard"
- extendedWaitUntil:
    visible:
      id: "${ASSISTANT_RESPONSE}"
    timeout: ${LLM_TEST_TIMEOUT_MS}
- takeScreenshot: "ai_hallucinated_action_response"
- assertVisible:
    id: "${ASSISTANT_RESPONSE}"
# There is no such screen: the assistant must say so, not confirm a navigation it cannot do.
- assertVisible:
    id: "${PROMPT_INPUT}"
- assertNotVisible:
    id: "${ASSISTANT_ACTION_CONFIRMATION}"
