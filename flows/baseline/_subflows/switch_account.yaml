# Worked example for the fictional Example Notes app — replace ids with your app's (inspect_screen).
# Every id below is illustrative; nothing here has been run against a real build.
# Reusable: switch the logged-in test user — logout (if logged in) → login → dismiss post-login prompts.
# Params: APP_ID, TEST_USERNAME, TEST_PASSWORD. Driven by scripts/release-tools/switch-account.sh.
# Ends on the user's landing screen — the script saves a capture of it.
appId: ${APP_ID}
---
- launchApp                            # cold start (no clearState): lands on home or login
- extendedWaitUntil:
    visible:
      id: "email_input|home_screen"
    timeout: 20000
- runFlow:
    when:
      visible:
        id: "home_screen"
    commands:
      - tapOn:
          id: "tab_settings"
      - waitForAnimationToEnd:
          timeout: 7500
      - scrollUntilVisible:
          element:
            id: "settings_logout_button"
          direction: DOWN
          timeout: 15000
      - tapOn:
          id: "settings_logout_button"
      - extendedWaitUntil:
          visible:
            id: "email_input"
          timeout: 15000
- runFlow:
    file: login.yaml
    env:
      APP_ID: ${APP_ID}
# (unit) Dismiss post-login interstitials here (PIN / biometrics / what's-new), each in a `when: visible:` block —
# list them in the account's notes in config/accounts.json.
# (unit) A transient login error ("Something went wrong" + Retry) is worth one automatic retry:
#   - runFlow: { when: { visible: "<error title>" }, commands: [ { tapOn: "Retry" }, { tapOn: { id: "login_button" } } ] }
